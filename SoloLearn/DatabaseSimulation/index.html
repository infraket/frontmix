<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Database</title>
</head>

<body id="body">
    <form id="myForm">
        <label for="city">Enter city:</label>
        <input type="text" id="city"></br></br>
        <label for="country">Enter country:</label>
        <input type="text" id="country"></br></br>
        <input type="submit" onclick="processFormData(); return false;">
    </form>

    <div id="table">
        <h2>Database Simulation</h2>
        <table id="dataTable">
            <tr>
                <th>city</th>
                <th>country</th>
            </tr>
        </table>
    </div>


    <h4>Registration Form</h4>

    <form id="myFormReg">
        <label for="name">Enter email:</label>
        <input type="text" id="email" name="email">
        </br>
        </br>
        <label for="age">Enter password:</label>
        <input type="password" id="pass" name="pass"></br></br>

        <input type="checkbox" id="subscribe" name="subscribe">
        <label for="subscribe">Subscribe to our newsletter</label></br></br>

        <p>Payment method:</p>
        <input type="radio" id="r1" name="pay" value="cash">
        <label for="r1">Cash</label>
        <input type="radio" id="r2" name="pay" value="card">
        <label for="r2">Card</label> </br></br>

        <input type="submit" onclick="processFormDataReg(); return false;">
    </form>

    <div id="table">
        <h2>Database Simulation</h2>
        <table id="dataTableReg">
            <tr>
                <th>email</th>
                <th>password</th>
                <th>isSubscribed</th>
                <th>method</th>

            </tr>
        </table>
    </div>

    <h3>Ensure you enter valid color names.</h3>
    <form id="myFormColor">
        <label for="background">Enter background color:</label></br>
        <input type="text" id="background" value="grey"></br></br>
        <label for="color">Enter text color:</label></br>
        <input type="text" id="color" value="white"></br></br>
        <input type="button" onclick="changeStyle()" value="Change">
    </form>

</body>


</html>
